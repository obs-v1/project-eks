# Loki — SingleBinary, EBS-persistent, native OTLP ingestion on /otlp.
fullnameOverride: loki

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    allow_structured_metadata: true   # OTLP trace_id lands as structured metadata / label
    volume_enabled: true
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: gp3
    size: 20Gi

# Lab scale — turn off the microservice components and the gateway.
backend:   { replicas: 0 }
read:      { replicas: 0 }
write:     { replicas: 0 }
gateway:   { enabled: false }
chunksCache:   { enabled: false }
resultsCache:  { enabled: false }
lokiCanary:    { enabled: false }
test:          { enabled: false }
